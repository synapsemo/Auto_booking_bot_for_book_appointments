[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gvc-appointment-bot"
version = "0.1.0"
description = "Configurable browser appointment runner with a local demo"
requires-python = ">=3.11"
dependencies = ["playwright==1.58.0"]

[project.scripts]
gvc-bot = "gvc_bot.cli:main"

[tool.setuptools.packages.find]
include = ["gvc_bot*"]
